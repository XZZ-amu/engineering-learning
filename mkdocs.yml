site_name: 工程知识学习
site_url: https://xzz-amu.github.io/engineering-learning/
site_description: 为产品设计师定制的工程基础教材
theme:
  name: material
  language: zh
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: 切换到深色模式
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: 切换到浅色模式
  features:
  - navigation.instant
  - navigation.tabs
  - navigation.top
  - toc.follow
  - search.suggest
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tasklist:
    custom_checkbox: true
- toc:
    permalink: true
extra_javascript:
- javascripts/quiz.js
- javascripts/progress.js
extra_css:
- stylesheets/interactive.css
nav:
- 首页: index.md
- 教案:
  - 异步任务与队列：用户点了"生成"按钮，然后呢？: chapters/chapter-05.md
  - API 设计：让两个系统能说上话: chapters/chapter-06.md
  - P0-3：文件与存储 — 图片/视频从产生到用户看到: chapters/chapter-07.md
  - P0-4：前端状态与数据流（React）: chapters/chapter-08.md
  - 'P1-1: AI 工程基础 — 模型调用、prompt 结构、采样参数、工作流': chapters/chapter-09.md
  - 数据库基础：SQL vs NoSQL、表结构、查询、索引: chapters/chapter-10.md
  - 认证与付费：让系统认识你，让用户放心付钱: chapters/chapter-11.md
  - WebSocket 与实时通信: chapters/chapter-12.md
  - P2-1：系统设计 — 从零画出 AI 创作产品的技术蓝图: chapters/chapter-13.md
  - P2-2：性能与体验优化: chapters/chapter-14.md
  - 安全基础：AI 创作产品不是单纯的创作工具: chapters/chapter-15.md
