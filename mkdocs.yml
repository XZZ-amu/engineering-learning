site_name: 工程知识学习
site_url: https://xzz-amu.github.io/engineering-learning/
site_description: 为产品设计师定制的工程基础教材
theme:
  name: material
  language: zh
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: 切换到深色模式
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: 切换到浅色模式
  features:
  - navigation.instant
  - navigation.tabs
  - navigation.top
  - toc.follow
  - search.suggest
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- toc:
    permalink: true
nav:
- 首页: index.md
- 参考项目: references.md
- 教案:
  - 'P0-1: 异步任务与队列': chapters/chapter-05.md
  - API 设计：让两个程序能对话的合约: chapters/chapter-06.md
  - 文件与存储：图片从生成到用户看到，中间发生了什么: chapters/chapter-07.md
  - P0-4：前端状态与数据流（React）: chapters/chapter-08.md
  - 'P1-1: AI 工程基础 — 模型调用、Prompt 结构、采样参数、工作流': chapters/chapter-09.md
  - 数据库基础：数据是怎么被"放好"和"找到"的: chapters/chapter-10.md
  - P1-3：认证与付费——登录、Token、OAuth、计费、订阅: chapters/chapter-11.md
  - 'P1-4: WebSocket 与实时通信': chapters/chapter-12.md
  - P2-1：系统设计 — 从零画出 AI 创作产品的技术蓝图: chapters/chapter-13.md
  - P2-2：性能与体验优化: chapters/chapter-14.md
  - P2-3：安全基础 — 内容安全、API 防滥用、用户数据保护: chapters/chapter-15.md
